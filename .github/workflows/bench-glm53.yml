---
name: Benchmark GLM-5.3-Flash (on-demand)

# On-demand GLM-5.3-Flash benchmark lane for the AMD DevLab Dispatch ephemeral
# runner pool. Dispatch it with the ref to measure; it checks that ref out,
# builds llama-bench and test-backend-ops for gfx1151 (HIP), runs the
# backend-ops suites for the ops this branch touches, then runs one llama-bench
# matrix and uploads every log plus the raw jsonl as one artifact.
#
# Dispatch-only on purpose: it downloads a ~102 GB model and holds a GPU for
# tens of minutes, and the DevLab pool queue is measured in hours, so it must
# never become a required check.
#
# Runner labels: `devlab-dispatch` is the opt-in gate that reaches the AMD
# Ryzen AI Dev Lab ephemeral pool at all, and `strix-halo` narrows it to Strix
# Halo silicon inside that pool. `strix-halo` on its own reaches nothing. Do
# not use `runs-on: group:` - the pool matches on labels only. A wrong label
# does not fail, it queues silently, so keep both.
#
# The benchmark is the requested command:
#   llama-bench -hf unsloth/GLM-5.3-Flash-GGUF -d 0,30000 -p 2048 -n 256 -ub 2048,4096
# with three additions, each required for it to measure what it says:
#   - the quant is pinned to UD-IQ2_XXS. A bare -hf repo resolves through
#     find_best_model's Q4_K_M-then-Q8_0 preference to the Q8_0 shards, a
#     ~341 GB download; UD-IQ2_XXS is the quant this work was tuned on.
#   - -b 2048,4096 is added. llama_context clamps n_ubatch to n_batch, so with
#     the default -b 2048 the requested -ub 4096 row would silently run at
#     2048 and the two rows would be identical.
#   - -ngl 99, without which the model runs on CPU.
#   - HF_HUB_CACHE points at $RUNNER_TEMP: the runner's $HOME is a ~63 GiB
#     container overlay while $RUNNER_TEMP is on the 1.4 TiB scratch disk.
#   - MODEL_ENDPOINT/HF_ENDPOINT default to huggingface.co: the runner's own
#     mirror was dropping connections part-way through the ~102 GB download.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build and benchmark'
        required: false
        default: 'master'
      reps:
        description: 'llama-bench repetitions per test (-r)'
        required: false
        default: '3'
      hf_endpoint:
        description: 'HuggingFace endpoint to download the model from'
        required: false
        default: 'https://huggingface.co'
      skip_ops:
        description: 'Skip test-backend-ops'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# No cancel-in-progress: the pool queues silently for hours and cancelling kills
# runs that were never assigned a host. Serialise on the requested ref instead.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 0
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  bench:
    name: ${{ inputs.ref }}
    runs-on: [self-hosted, Linux, devlab-dispatch, strix-halo]
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Report environment
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_REPS: ${{ inputs.reps }}
        run: |
          # diagnostics only, so never fail the job on a missing probe
          set +e
          mkdir -p "$RUNNER_TEMP/logs"
          {
            git log --oneline -1
            uname -a
            nproc
            free -g
            df -h "$RUNNER_TEMP" . "$HOME"
            rocminfo | grep -E '^  Name|Marketing Name' | head -6
            rocm-smi --showproductname | head -8
            cmake --version | head -1
            hipconfig --version
          } 2>&1 | tee "$RUNNER_TEMP/logs/environment.log"

          {
            echo "### Benchmark GLM-5.3-Flash (on-demand)"
            echo
            echo "- ref: \`$INPUT_REF\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- repetitions: \`$INPUT_REPS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"

          # same shape as .github/workflows/hip-quality-check.yml, which is
          # this repository's own gfx1151 recipe
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_HIP=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx1151 \
            -DGGML_HIP_EXPORT_METRICS=Off \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            2>&1 | tee "$RUNNER_TEMP/logs/build-cmake.log"

          cmake --build build --config Release -j "$(nproc)" \
            --target llama-bench test-backend-ops \
            2>&1 | tee "$RUNNER_TEMP/logs/build-make.log"

      - name: Detect GPU device
        id: device
        run: |
          # the runner starts bash with -e; drop it so the failure path below runs
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./build/bin/llama-bench --list-devices > "$RUNNER_TEMP/devices.txt"
          rc=$?
          cp "$RUNNER_TEMP/devices.txt" "$RUNNER_TEMP/logs/devices.txt"
          cat "$RUNNER_TEMP/logs/devices.txt"
          if [ "$rc" -ne 0 ]; then
            echo "::error::llama-bench --list-devices failed (exit $rc)" >&2
            exit "$rc"
          fi
          dev=$(grep -oE '^  (ROCm|Vulkan)[0-9]+:' "$RUNNER_TEMP/devices.txt" | head -1 | tr -d ' :') || dev=""
          if [ -z "$dev" ]; then
            echo "::error::no GPU device registered; the requested backend did not build in" >&2
            exit 1
          fi
          echo "OPS_DEVICE=$dev" >> "$GITHUB_ENV"
          echo "device: $dev"

      - name: test-backend-ops
        if: ${{ !inputs.skip_ops }}
        run: |
          # the runner starts bash with -e; drop it so the guards below always run
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          log="$RUNNER_TEMP/logs/ops-test.log"
          # the ops this branch touches: the gated delta net prefill kernel and
          # the matmul dispatch ladder the mmw kernels sit in
          ./build/bin/test-backend-ops test -b "$OPS_DEVICE" \
            -o GATED_DELTA_NET,GATED_DELTA_NET_CACHE_FUSION,MUL_MAT,MUL_MAT_ID 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}

          # `-b` with a name that matches no device exits 0 and still prints
          # "N/N backends passed", so prove the device really ran.
          awk -v dev="$OPS_DEVICE" '
            $0 ~ "^Backend [0-9]+/[0-9]+: " dev "$" {
              seen = 1
              if ((getline nxt) > 0 && nxt !~ /^  Skipping/) ran = 1
            }
            END { exit !(seen && ran) }
          ' "$log" || { echo "::error::$OPS_DEVICE never ran; the -b filter matched nothing" >&2; exit 1; }

          total=$(grep -oE '[0-9]+/[0-9]+ tests passed' "$log" | tail -1 | cut -d/ -f2 | awk '{print $1}')
          echo "tests passed: ${total:-none}"
          if [ -z "$total" ] || [ "$total" -le 0 ]; then
            echo "::error::no test-backend-ops cases ran" >&2
            exit 1
          fi

          exit "$rc"

      - name: llama-bench
        env:
          REPS: ${{ inputs.reps }}
          # the runner's default HF mirror was dropping connections mid-download, so
          # override it with the real endpoint unless told otherwise
          MODEL_ENDPOINT: ${{ inputs.hf_endpoint }}
          HF_ENDPOINT: ${{ inputs.hf_endpoint }}
          # the runner's $HOME is a ~63 GiB container overlay while $RUNNER_TEMP sits on
          # the 1.4 TiB scratch disk, so point the HF cache at the big filesystem
          HF_HUB_CACHE: ${{ runner.temp }}/hf
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"

          reps="$REPS"
          case "$reps" in
            '' | *[!0-9]*)
              echo "::error::reps must be a positive integer, got '$reps'" >&2
              exit 2
              ;;
          esac
          if [ "${#reps}" -gt 6 ] || [ "$(( 10#$reps ))" -le 0 ]; then
            echo "::error::reps must be between 1 and 999999, got '$reps'" >&2
            exit 2
          fi
          reps=$(( 10#$reps ))

          # UD-IQ2_XXS is four shards, ~102 GB. Fail fast rather than after an
          # hour of downloading if the filesystem holding the cache cannot take it.
          need=$(( 105 * 1024 * 1024 * 1024 ))
          cache_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1)
          echo "disk free for the model cache: $(( cache_bytes / 1073741824 )) GiB"
          if [ "$cache_bytes" -lt "$need" ]; then
            echo "::error::need $(( need / 1073741824 )) GiB free for the model, have $(( cache_bytes / 1073741824 )) GiB" >&2
            exit 1
          fi

          jsonl="$RUNNER_TEMP/logs/glm53.jsonl"
          log="$RUNNER_TEMP/logs/glm53.log"

          # n_ctx is n_prompt + n_gen + n_depth = 2048 + 256 + 30000.
          # HIP_LAUNCH_BLOCKING is deliberately NOT set: it serialises every
          # kernel launch and would invalidate every throughput number.
          timeout 14400 ./build/bin/llama-bench \
            -hf unsloth/GLM-5.3-Flash-GGUF:UD-IQ2_XXS \
            -p 2048 -n 256 \
            -d 0,30000 \
            -b 2048,4096 -ub 2048,4096 \
            -ngl 99 \
            -r "$reps" -o jsonl --progress \
            > "$jsonl" 2> "$log"
          rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::llama-bench failed (exit $rc)" >&2
            exit "$rc"
          fi
          if [ ! -s "$jsonl" ]; then
            echo "::error::llama-bench produced no jsonl rows" >&2
            exit 1
          fi
          echo "jsonl rows: $(wc -l < "$jsonl")"
          {
            echo "### llama-bench"
            echo
            echo '```'
            cat "$jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-glm53-${{ github.run_id }}
          path: ${{ runner.temp }}/logs
          retention-days: 30
          if-no-files-found: warn
